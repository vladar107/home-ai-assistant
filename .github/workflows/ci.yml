name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  race:
    name: race (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [eval, telegram, connectors, rest]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # setup-go's cache key is shared with the image workflow, which saves it without race builds.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go race builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Test with race detection
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          module="$(go list -m)"
          all="$(go list ./...)"
          connectors="^$module/(internal/connectors|internal/store|internal/testutil|cmd)(/|$)"
          case "$SHARD" in
            eval) packages=("$module/internal/eval") ;;
            telegram) packages=("$module/internal/telegram") ;;
            connectors) mapfile -t packages < <(grep -E "$connectors" <<<"$all") ;;
            rest) mapfile -t packages < <(grep -vxF -e "$module/internal/eval" -e "$module/internal/telegram" <<<"$all" | grep -vE "$connectors") ;;
          esac
          (( ${#packages[@]} ))
          go test -race -timeout 30m "${packages[@]}"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Check immutable plans
        run: scripts/check-plans HEAD^

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Check module files
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -buildvcs=false ./...

  # The ruleset requires this check; it passes only when every job above passed.
  validate:
    if: always()
    needs: [race, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RACE: ${{ needs.race.result }}
          CHECKS: ${{ needs.checks.result }}
        run: test "$RACE" = success && test "$CHECKS" = success
