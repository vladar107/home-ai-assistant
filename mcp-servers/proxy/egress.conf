# Forward proxy for one MCP server: CONNECT to port 443 of the hosts in its filter file, nothing
# else. With no LogFile and no Syslog, tinyproxy logs to stdout.
Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 32
LogLevel Connect
DisableViaHeader Yes
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterDefaultDeny Yes
