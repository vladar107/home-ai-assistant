# Grafana. Applied on top of compose.app.yaml only when HOME_AGENT_GRAFANA_ENABLED is true, so a
# deployment without the feature needs no Grafana token on the NAS. Grafana is reached by its
# service name over the shared home-observability network.
services:
  home-agent:
    environment:
      HOME_AGENT_GRAFANA_TOKEN_FILE: /run/secrets/grafana-token
      HOME_AGENT_GRAFANA_URL: http://grafana:3000
      HOME_AGENT_GRAFANA_PRINCIPALS: ${HOME_AGENT_GRAFANA_PRINCIPALS:?set HOME_AGENT_GRAFANA_PRINCIPALS}
    secrets:
      - source: grafana-token
        target: grafana-token

secrets:
  grafana-token:
    file: ${HOME_AGENT_SECRETS_PATH:?set HOME_AGENT_SECRETS_PATH}/grafana-token
