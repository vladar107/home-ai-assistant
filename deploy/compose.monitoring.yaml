name: home-observability

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"

services:
  alloy:
    <<: *service-defaults
    image: grafana/alloy:v1.19.2
    platform: linux/amd64
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    read_only: true
    # The pinned image creates the alloy user as UID/GID 473. Keep the process
    # non-root and make the host bind mount match it; cap_drop removes DAC
    # override, so a mode-700 directory owned by the NAS account is not usable.
    user: "473:473"
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - type: bind
        source: ./alloy/config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
      - type: bind
        source: ${ALLOY_DATA_PATH:?set ALLOY_DATA_PATH}
        target: /var/lib/alloy/data
        bind:
          create_host_path: false
    networks:
      - home-observability
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.13.2
    platform: linux/amd64
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    read_only: true
    user: "${NAS_RUNTIME_UID:?set NAS_RUNTIME_UID}:${NAS_RUNTIME_GID:?set NAS_RUNTIME_GID}"
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - type: bind
        source: ./prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ${PROMETHEUS_DATA_PATH:?set PROMETHEUS_DATA_PATH}
        target: /prometheus
        bind:
          create_host_path: false
    networks:
      - home-observability
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256

  tempo:
    <<: *service-defaults
    image: grafana/tempo:3.0.0
    platform: linux/amd64
    command:
      - -config.file=/etc/tempo/tempo.yaml
    read_only: true
    user: "${NAS_RUNTIME_UID:?set NAS_RUNTIME_UID}:${NAS_RUNTIME_GID:?set NAS_RUNTIME_GID}"
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - type: bind
        source: ./tempo/tempo.yaml
        target: /etc/tempo/tempo.yaml
        read_only: true
      - type: bind
        source: ${TEMPO_DATA_PATH:?set TEMPO_DATA_PATH}
        target: /var/tempo
        bind:
          create_host_path: false
    networks:
      - home-observability
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256

  grafana:
    <<: *service-defaults
    image: grafana/grafana:13.2.1
    platform: linux/amd64
    read_only: true
    user: "${NAS_RUNTIME_UID:?set NAS_RUNTIME_UID}:${NAS_RUNTIME_GID:?set NAS_RUNTIME_GID}"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_PASSWORD_POLICY: "true"
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/grafana-secret-key
      GF_SERVER_ROOT_URL: http://${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - ${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000
    secrets:
      - grafana-admin-password
      - grafana-secret-key
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: ${GRAFANA_DATA_PATH:?set GRAFANA_DATA_PATH}
        target: /var/lib/grafana
        bind:
          create_host_path: false
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./grafana/dashboards
        target: /var/lib/grafana-provisioned-dashboards
        read_only: true
    networks:
      - home-observability
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256

secrets:
  grafana-admin-password:
    file: ${GRAFANA_SECRETS_PATH:?set GRAFANA_SECRETS_PATH}/admin-password
  grafana-secret-key:
    file: ${GRAFANA_SECRETS_PATH:?set GRAFANA_SECRETS_PATH}/secret-key

networks:
  home-observability:
    external: true
    name: home-observability
