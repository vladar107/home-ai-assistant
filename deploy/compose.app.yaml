name: home-ai-assistant

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"

services:
  home-agent:
    <<: *service-defaults
    image: ${HOME_AGENT_IMAGE:?set HOME_AGENT_IMAGE to the NAS-built image tag}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGETOS: linux
        TARGETARCH: amd64
    platform: linux/amd64
    pull_policy: never
    read_only: true
    user: "${NAS_RUNTIME_UID:?set NAS_RUNTIME_UID}:${NAS_RUNTIME_GID:?set NAS_RUNTIME_GID}"
    environment:
      HOME: /var/lib/home-agent
      HOME_AGENT_ALLOW_NON_LOOPBACK: "true"
      HOME_AGENT_CONVERSATION_ENABLED: "true"
      HOME_AGENT_CONVERSATION_TURN_TIMEOUT: ${HOME_AGENT_CONVERSATION_TURN_TIMEOUT:-2m}
      HOME_AGENT_DATA_DIR: /var/lib/home-agent
      HOME_AGENT_LISTEN_ADDRESS: 0.0.0.0:8080
      HOME_AGENT_OTEL_ENABLED: "true"
      HOME_AGENT_PI_BINARY: /usr/local/bin/pi
      HOME_AGENT_PI_MODEL: ${HOME_AGENT_PI_MODEL:?set HOME_AGENT_PI_MODEL}
      HOME_AGENT_PI_NODE_BINARY: /usr/local/bin/node
      HOME_AGENT_PI_PROVIDER: ${HOME_AGENT_PI_PROVIDER:-openai-codex}
      HOME_AGENT_PI_VERSION: ${HOME_AGENT_PI_VERSION:-0.84.1}
      HOME_AGENT_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram-bot-token
      HOME_AGENT_TELEGRAM_ENABLED: "true"
      HOME_AGENT_TELEGRAM_USERS_FILE: /etc/home-agent/telegram-users.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: "30000"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:-home},service.version=${HOME_AGENT_VERSION:-dev}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-home-agent}
    ports:
      - 127.0.0.1:${HOME_AGENT_HEALTH_PORT:-18080}:8080
    secrets:
      - source: telegram-bot-token
        target: telegram-bot-token
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: ${HOME_AGENT_DATA_PATH:?set HOME_AGENT_DATA_PATH}
        target: /var/lib/home-agent
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME_AGENT_TELEGRAM_USERS_FILE_PATH:?set HOME_AGENT_TELEGRAM_USERS_FILE_PATH}
        target: /etc/home-agent/telegram-users.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      - home-observability
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

secrets:
  telegram-bot-token:
    file: ${HOME_AGENT_SECRETS_PATH:?set HOME_AGENT_SECRETS_PATH}/telegram-bot-token

networks:
  home-observability:
    external: true
    name: home-observability
