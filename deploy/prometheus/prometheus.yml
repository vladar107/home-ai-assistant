global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Application metrics arrive through Alloy's OTLP receiver. This scrape list is
# limited to the monitoring services so additional applications can join the
# home-observability network without changing this project.

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
